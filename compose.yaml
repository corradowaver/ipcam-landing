name: ipcam-landing

services:
  landing:
    image: ipcam-landing:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - '${LANDING_HOST:-127.0.0.1}:${LANDING_PORT:-3001}:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
